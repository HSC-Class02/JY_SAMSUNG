name: Test DART API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Test DART API
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ.get("DART_API_KEY")
          if not key:
              raise SystemExit("DART_API_KEY Secret is missing.")

          response = requests.get(
              "https://opendart.fss.or.kr/api/company.json",
              params={"crtfc_key": key, "corp_code": "00126380"},
              timeout=30,
          )
          response.raise_for_status()
          data = response.json()

          if data.get("status") != "000":
              raise SystemExit(
                  f"DART API error: {data.get('status')} - {data.get('message')}"
              )

          print("DART API connection successful.")
          print("Company:", data.get("corp_name"))
          PY
